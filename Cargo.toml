[package]
name = "diary"
version = "0.1.0"
edition = "2024"
description = "Collect your thoughts and notes without leaving the command line (a Rust jrnl clone)."
license = "MIT"

[[bin]]
name = "jrnl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
colored = "2"
dirs = "7.0.0"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
plist = "1"
rand = "0.8"
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
strsim = "0.11"
tempfile = "3"
terminal_size = "0.4"
textwrap = "0.16"
uuid = { version = "1", features = ["v4"] }
